kind = "mobile"
previewPath = "/mobile/"
title = "Maya Logistics Mobile"
version = "1.0.0"
id = "artifacts/maya-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20288

[services.development]
run = "pnpm --filter @workspace/maya-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maya-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/maya-mobile", "run", "serve" ]

[services.env]
PORT = "20288"
BASE_PATH = "/mobile/"
